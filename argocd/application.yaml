apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nyanko-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/KUMA-roza/argocd.git
    path: nyanko
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      enabled: false
    syncOptions:
      - CreateNamespace=true
